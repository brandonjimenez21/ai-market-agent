services:
  # 1. FRONTEND: Next.js
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env.local
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    networks:
      - agent-network

  # 2. THE MUSCLE: Go API Gateway
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./gateway:/app
    environment:
      - REDIS_URL=redis:6379
      - PYTHON_AI_URL=http://ai-engine:8000
    depends_on:
      - redis
    networks:
      - agent-network

  # 3. THE BRAIN: Python FastAPI + AI
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./ai-engine:/app
    env_file:
      - .env
    environment:
      - REDIS_URL=redis:6379
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - redis
      - qdrant
    networks:
      - agent-network

  # 4. THE MESSENGER: Redis
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - agent-network

  # 5. THE MEMORY OF THE AI: Qdrant (Vector Database)
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - agent-network

  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: agent_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - agent-network

# Network configuration and persistent volumes
networks:
  agent-network:
    driver: bridge

volumes:
  qdrant_data:
  pgdata: